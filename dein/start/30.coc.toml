# File: dein/start/30.coc.toml
# Description: Conquer of Completion (CoC) engine & keymaps

[[plugins]]
repo = "neoclide/coc.nvim"
rev = "release"
build = "npm ci"
hook_add = '''
    " Расширения coc, которые установятся автоматически при старте
    let g:coc_global_extensions = [
        \ 'coc-pyright',
        \ 'coc-json',
        \ 'coc-snippets',
        \ '@yaegassy/coc-ruff',
        \ ]

    " Использовать Tab для навигации по меню автодополнения
    inoremap <silent><expr> <TAB>
        \ coc#pum#visible() ? coc#pum#next(1) :
        \ check_back_space() ? "\<Tab>" :
        \ coc#refresh()
    inoremap <expr><S-TAB> coc#pum#visible() ? coc#pum#prev(1) : "\<C-h>"

    " Подтверждение выбора по Enter
    inoremap <silent><expr> <CR> coc#pum#visible() ? coc#pum#confirm()
                                \: "\<C-g>u\<CR>\<c-r>=coc#on_enter()\<CR>"

    function! s:check_back_space() abort
        let col = col('.') - 1
        return !col || getline('.')[col - 1]  =~# '\s'
    endfunction

    " Навигация по коду (LSP)
    nmap <silent> gd <Plug>(coc-definition)
    nmap <silent> gy <Plug>(coc-type-definition)
    nmap <silent> gi <Plug>(coc-implementation)
    nmap <silent> gr <Plug>(coc-references)

    " Показ документации / информации о типе под курсором (K)
    nnoremap <silent> K :call s:show_documentation()<CR>

    function! s:show_documentation()
        if CocAction('hasProvider', 'hover')
            call CocActionAsync('doHover')
        else
            call coc#rpc#notify('doHover', [])
        endif
    endfunction

    " Переименование символа (Rename)
    nmap <leader>rn <Plug>(coc-rename)

    " Форматирование выделенного кода или всего файла
    xmap <leader>f  <Plug>(coc-format-selected)
    nmap <leader>f  <Plug>(coc-format-selected)
'''
